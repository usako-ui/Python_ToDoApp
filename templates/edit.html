<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>タスク編集</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h1 class="mb-4">タスク編集</h1>

      <form action="{{ url_for('update', task_id=task.ID) }}" method="post">
        <div class="mb-2">
          <label class="form-label">タイトル</label>
          <input class="form-control" name="title" value="{{ task.Title }}" required>
        </div>
        <div class="mb-2">
          <label class="form-label">内容</label>
          <textarea class="form-control" name="content" rows="4">{{ task.Content }}</textarea>
        </div>
        <div class="mb-2">
          <label class="form-label">期日（日時）</label>
          <!-- シートに保存されている形式が YYYY-MM-DDTHH:MM の場合はそのまま使える -->
          <input class="form-control" type="datetime-local" name="duedate"
            value="{{ task.DueDate if 'T' in task.DueDate else task.DueDate.replace(' ', 'T') }}">
        </div>

        <button class="btn btn-primary" type="submit">保存</button>
        <a class="btn btn-secondary" href="{{ url_for('index') }}">キャンセル</a>
      </form>

    </div>
  </body>
</html>
